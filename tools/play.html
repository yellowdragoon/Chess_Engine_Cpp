<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the engine</title>
<style>
  :root {
    --bg: #f3f1ed; --panel: #ffffff; --panel-2: #f6f4f0; --text: #1f1d1a; --muted: #77716a;
    --line: #e4e0d8; --accent: #3d7a57; --accent-text: #ffffff; --danger: #c0392b;
    --light: #f0d9b5; --dark: #b58863;
    --hl-last: rgba(155, 199, 0, .41); --hl-sel: rgba(20, 85, 30, .5); --hl-dot: rgba(20, 85, 30, .45);
    --shadow: 0 10px 30px rgba(40, 30, 20, .14);
    --size: min(calc(100vw - 56px), calc(100vh - 150px), 640px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161512; --panel: #262421; --panel-2: #2e2b27; --text: #e8e4dc; --muted: #9a948a;
      --line: #3a3732; --accent: #629b78; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }

  .app {
    min-height: 100vh; display: flex; gap: 28px; justify-content: center; align-items: center;
    padding: 24px 16px;
  }
  .stage { display: flex; gap: 10px; align-items: stretch; }

  /* eval bar */
  .evalbar {
    width: 18px; border-radius: 4px; overflow: hidden; position: relative;
    background: #403d39; margin: 44px 0; box-shadow: var(--shadow);
  }
  .evalbar .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #f5f3ef;
    transition: height .45s ease;
  }
  .evalbar.flipped .fill { top: 0; bottom: auto; }
  .evalbar .num {
    position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700;
    font-variant-numeric: tabular-nums; z-index: 1; letter-spacing: -.3px;
  }

  /* players and board */
  .boardcol { display: flex; flex-direction: column; gap: 8px; width: var(--size); }
  .player {
    height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 4px;
  }
  .player .avatar {
    width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line);
  }
  .player .avatar img, .player .avatar span { width: 24px; height: 24px; font-size: 22px; line-height: 24px; text-align: center; }
  .player .name { font-weight: 650; }
  .player .sub { color: var(--muted); font-size: 12.5px; }
  .player .turn {
    margin-left: auto; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  .player .turn::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0;
  }
  .player.active .turn::before { opacity: 1; }
  .player.thinking .turn::before { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  #board {
    width: var(--size); height: var(--size); display: grid; position: relative;
    grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
    border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); user-select: none; touch-action: none;
  }
  .sq { position: relative; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last { background-image: linear-gradient(var(--hl-last), var(--hl-last)); }
  .sq.sel { background-image: linear-gradient(var(--hl-sel), var(--hl-sel)); }
  .sq.check { background-image: radial-gradient(ellipse at center, #ff0000 0%, #e70000 25%, rgba(169,0,0,0) 89%); }
  .sq.target::after {
    content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%;
    border-radius: 50%; background: var(--hl-dot); pointer-events: none;
  }
  .sq.target.occ::after {
    left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; background:
      radial-gradient(transparent 0%, transparent 79%, var(--hl-dot) 80%);
  }
  .sq.target:hover::after { left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; background: var(--hl-dot); opacity: .5; }
  .pc { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; pointer-events: none; }
  .glyph { display: grid; place-items: center; font-size: calc(var(--size) / 9.5); line-height: 1; }
  .glyph.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000; }
  .glyph.b { color: #111; }
  .sq.from .pc { opacity: .3; }
  .coord {
    position: absolute; font-size: calc(var(--size) / 55); font-weight: 700; z-index: 0; pointer-events: none;
  }
  .coord.f { right: 4%; bottom: 2%; } .coord.r { left: 4%; top: 3%; }
  .sq.l .coord { color: var(--dark); } .sq.d .coord { color: var(--light); }
  .ghost {
    position: fixed; width: calc(var(--size) / 8); height: calc(var(--size) / 8); pointer-events: none;
    z-index: 50; transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
  }

  #promo {
    position: absolute; inset: 0; background: rgba(0, 0, 0, .45); display: none; z-index: 20;
    align-items: center; justify-content: center;
  }
  #promo .choices { display: flex; gap: 8px; background: var(--panel); padding: 10px; border-radius: 10px; box-shadow: var(--shadow); }
  #promo button {
    width: calc(var(--size) / 7.5); height: calc(var(--size) / 7.5); border: 0; border-radius: 8px;
    background: var(--panel-2); cursor: pointer; padding: 6px; position: relative;
  }
  #promo button:hover { background: var(--light); }
  #promo .pc { position: static; }

  /* side panel */
  aside {
    width: 320px; align-self: stretch; max-height: calc(var(--size) + 88px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field:last-of-type { margin-bottom: 14px; }
  .field > span { font-size: 12.5px; color: var(--muted); }
  #engine-desc { color: var(--muted); font-size: 12px; line-height: 1.35; }
  #engine-desc:empty { display: none; }
  select, input[type=text] {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
  }
  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
  .seg button {
    flex: 1; font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted);
    padding: 6px 0; border-radius: 5px; cursor: pointer;
  }
  .seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .btn {
    font: inherit; font-weight: 600; border-radius: 7px; padding: 9px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { width: 100%; background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .45; cursor: default; }

  .moves-wrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; overflow: hidden; }
  .moves-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; }
  .moves-head .eyebrow { margin: 0; }
  .tools { display: flex; gap: 6px; }
  .tools .btn { padding: 5px 9px; font-size: 12.5px; font-weight: 500; }
  #moves {
    flex: 1; overflow-y: auto; padding: 0 8px 10px; display: grid; grid-template-columns: 34px 1fr 1fr;
    align-content: start; font-variant-numeric: tabular-nums;
  }
  #moves span { padding: 3px 8px; border-radius: 4px; }
  #moves .n { color: var(--muted); padding-left: 8px; }
  #moves .cur { background: var(--panel-2); font-weight: 650; }
  #moves .empty { grid-column: 1 / -1; color: var(--muted); padding: 6px 8px; }
  .banner { margin: 0 16px 12px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-weight: 600; display: none; }
  .banner.show { display: block; }
  .banner.err { color: var(--danger); }

  @media (max-width: 960px) {
    :root { --size: min(calc(100vw - 60px), 640px); }
    .app { flex-direction: column; align-items: center; }
    aside { width: calc(var(--size) + 28px); max-height: none; }
    .moves-wrap { max-height: 240px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="evalbar" id="evalbar" title="Engine eval"><div class="fill"></div><span class="num" id="evalnum"></span></div>
    <div class="boardcol">
      <div class="player" id="top"></div>
      <div id="board"></div>
      <div class="player" id="bottom"></div>
    </div>
  </section>

  <aside>
    <div class="section">
      <div class="eyebrow">New game</div>
      <label class="field"><span>Opponent</span><select id="engine"></select>
        <small id="engine-desc"></small></label>
      <div class="field"><span>You play</span>
        <div class="seg" id="color">
          <button data-v="w">White</button><button data-v="b">Black</button><button data-v="r">Random</button>
        </div>
      </div>
      <div class="field"><span>Engine time per move</span>
        <div class="seg" id="time">
          <button data-v="0.1">0.1s</button><button data-v="0.5">0.5s</button><button data-v="1">1s</button>
          <button data-v="3">3s</button><button data-v="10">10s</button>
        </div>
      </div>
      <label class="field"><span>Start position (FEN, optional)</span>
        <input id="fen" type="text" placeholder="Standard starting position" spellcheck="false" autocomplete="off">
      </label>
      <button class="btn primary" id="new">Start game</button>
    </div>

    <div class="moves-wrap">
      <div class="moves-head">
        <div class="eyebrow">Moves</div>
        <div class="tools">
          <button class="btn" id="undo" title="Take back your last move">Take back</button>
          <button class="btn" id="flip" title="Flip board">Flip</button>
        </div>
      </div>
      <div class="banner" id="banner"></div>
      <div id="moves"></div>
    </div>
  </aside>
</div>

<script>
// Piece art: Colin M.L. Burnett's set (GPLv2+), loaded from lichess's repo at a
// pinned commit rather than copied into this one. Offline, fall back to glyphs.
const PIECE_URL = "https://cdn.jsdelivr.net/gh/lichess-org/lila@32c5a830bd535a4cbe1f65556c5a45a0c7e25c48/public/piece/cburnett/";
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const FILES = "abcdefgh";

let state = null, selected = null, flipped = false, thinking = false, drag = null;
let useGlyphs = false;
const prefs = { color: "w", time: "1", engine: null };

const $ = (id) => document.getElementById(id);

// Preload the piece set; any failure switches to glyphs.
for (const c of "wb") for (const p of "KQRBNP") {
  const img = new Image();
  img.onerror = () => { if (!useGlyphs) { useGlyphs = true; if (state) render(); } };
  img.src = `${PIECE_URL}${c}${p}.svg`;
}

function pieceEl(code) {   // code like "N" or "n"
  const white = code === code.toUpperCase();
  if (useGlyphs) {
    const s = document.createElement("span");
    s.className = `pc glyph ${white ? "w" : "b"}`;
    s.textContent = GLYPH[code.toLowerCase()];
    return s;
  }
  const img = document.createElement("img");
  img.className = "pc"; img.draggable = false; img.alt = code;
  img.src = `${PIECE_URL}${white ? "w" : "b"}${code.toUpperCase()}.svg`;
  return img;
}

let pending = 0;   // requests in flight (the tests wait for this to reach 0)
async function api(path, body) {
  pending++;
  try {
    const res = await fetch(path, body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    return await res.json();
  } finally {
    pending--;
  }
}

function pieces(fen) {
  const map = {};
  fen.split(" ")[0].split("/").forEach((row, i) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      map[FILES[f] + (8 - i)] = ch;
      f++;
    }
  });
  return map;
}

const myTurn = () => state && !thinking && !state.status && state.turn === state.human && state.engine;
const isMine = (p) => p && (state.human === "w") === (p === p.toUpperCase());
const movesFrom = (sq) => state.legal.filter(m => m.startsWith(sq));

function renderBoard() {
  const board = $("board");
  board.querySelectorAll(".sq").forEach(e => e.remove());
  const map = pieces(state.fen);
  const targets = selected ? movesFrom(selected).map(m => m.slice(2, 4)) : [];
  const last = state.last ? [state.last.slice(0, 2), state.last.slice(2, 4)] : [];
  const kingSq = state.check
    ? Object.keys(map).find(sq => map[sq] === (state.turn === "w" ? "K" : "k")) : null;

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const f = flipped ? 7 - col : col, r = flipped ? row : 7 - row;
      const sq = FILES[f] + (r + 1);
      const el = document.createElement("div");
      el.className = "sq " + ((f + r) % 2 ? "l" : "d");
      el.dataset.sq = sq;
      if (last.includes(sq)) el.classList.add("last");
      if (sq === selected) el.classList.add("sel");
      if (sq === kingSq) el.classList.add("check");
      if (targets.includes(sq)) el.classList.add("target");
      if (drag && drag.from === sq) el.classList.add("from");
      if (map[sq]) {
        if (targets.includes(sq)) el.classList.add("occ");
        el.appendChild(pieceEl(map[sq]));
      }
      if (row === 7) el.insertAdjacentHTML("beforeend", `<span class="coord f">${FILES[f]}</span>`);
      if (col === 0) el.insertAdjacentHTML("beforeend", `<span class="coord r">${r + 1}</span>`);
      el.addEventListener("pointerdown", (e) => down(e, sq, map));
      board.appendChild(el);
    }
  }
}

function renderPlayers() {
  const engineColor = state.human === "w" ? "b" : "w";
  const sides = {
    human: { color: state.human, name: "You", sub: state.human === "w" ? "White" : "Black" },
    engine: {
      color: engineColor, name: state.engine || "No engine",
      sub: state.depth ? `depth ${state.depth}` : (engineColor === "w" ? "White" : "Black"),
      desc: ((state.versions || {})[state.engine] || {}).description,
    },
  };
  // the side at the bottom is whichever colour the board is oriented for
  const bottomColor = flipped ? "b" : "w";
  const bottom = sides.human.color === bottomColor ? sides.human : sides.engine;
  const top = bottom === sides.human ? sides.engine : sides.human;
  for (const [id, s] of [["top", top], ["bottom", bottom]]) {
    const el = $(id);
    const active = !state.status && state.turn === s.color;
    const isEngine = s === sides.engine;
    el.className = "player" + (active ? " active" : "") + (active && isEngine && thinking ? " thinking" : "");
    el.innerHTML = `<div class="avatar"></div><div><div class="name"></div><div class="sub"></div></div><div class="turn"></div>`;
    const icon = pieceEl(s.color === "w" ? (isEngine ? "N" : "K") : (isEngine ? "n" : "k"));
    icon.classList.remove("pc");
    el.querySelector(".avatar").appendChild(icon);
    el.querySelector(".name").textContent = s.name;
    el.querySelector(".name").title = s.desc || "";
    el.querySelector(".sub").textContent = s.sub;
    el.querySelector(".turn").textContent = active ? (isEngine ? (thinking ? "Thinking…" : "To move") : "Your move") : "";
  }
}

function renderEval() {
  const bar = $("evalbar"), num = $("evalnum");
  let frac = 0.5, label = "";
  if (state.mate !== null && state.mate !== undefined) {
    frac = state.mate > 0 ? 1 : 0; label = `M${Math.abs(state.mate)}`;
  } else if (state.cp !== null && state.cp !== undefined) {
    frac = 1 / (1 + Math.pow(10, -state.cp / 400));
    label = Math.abs(state.cp / 100).toFixed(1);
  }
  frac = Math.min(Math.max(frac, 0.03), 0.97);
  bar.classList.toggle("flipped", flipped);
  bar.querySelector(".fill").style.height = `${frac * 100}%`;
  // print the number at the end of the side that is ahead
  const whiteAhead = frac >= 0.5;
  num.textContent = label;
  num.style.color = whiteAhead ? "#403d39" : "#f5f3ef";
  num.style.top = num.style.bottom = "";
  if (whiteAhead !== flipped) num.style.bottom = "4px"; else num.style.top = "4px";
  bar.title = state.score ? `Engine eval ${state.score} (White's view)` : "No eval yet";
}

function renderPanel() {
  const sel = $("engine");
  if (sel.options.length !== state.engines.length) {
    sel.innerHTML = "";
    for (const n of state.engines) sel.add(new Option(n, n));
  }
  sel.value = prefs.engine ?? state.engine ?? state.engines[0];
  const v = (state.versions || {})[sel.value];
  $("engine-desc").textContent = v
    ? v.description + (v.depth ? ` · searches to depth ${v.depth} (no time control)` : "") : "";
  for (const b of $("color").children) b.classList.toggle("on", b.dataset.v === prefs.color);
  for (const b of $("time").children) b.classList.toggle("on", b.dataset.v === prefs.time);

  const banner = $("banner");
  const msg = state.error || state.status;
  banner.textContent = msg || "";
  banner.className = "banner" + (msg ? " show" : "") + (state.error ? " err" : "");

  const moves = $("moves");
  moves.innerHTML = "";
  if (!state.san.length) moves.innerHTML = `<span class="empty">No moves yet.</span>`;
  // pad with an empty white move when the game started with Black to move
  const plies = state.first_black ? [null, ...state.san] : state.san;
  for (let i = 0; i < plies.length; i += 2) {
    const cell = (j) => {
      if (j >= plies.length) return "<span></span>";
      if (plies[j] === null) return "<span>…</span>";
      return `<span${j === plies.length - 1 ? ' class="cur"' : ""}>${plies[j]}</span>`;
    };
    moves.insertAdjacentHTML("beforeend",
      `<span class="n">${state.first_move + i / 2}.</span>${cell(i)}${cell(i + 1)}`);
  }
  moves.scrollTop = moves.scrollHeight;
  $("undo").disabled = thinking || !state.san.length;
}

function render() { renderBoard(); renderPlayers(); renderEval(); renderPanel(); }

// ---- input: click-click or drag ----
function down(e, sq, map) {
  if (!myTurn() || e.button > 0) return;
  if (selected && selected !== sq && movesFrom(selected + sq).length) return tryMove(selected, sq);
  if (!isMine(map[sq])) { selected = null; return render(); }
  const wasSelected = selected === sq;
  selected = sq;
  const ghost = pieceEl(map[sq]);
  ghost.classList.remove("pc"); ghost.classList.add("ghost");
  ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  drag = { from: sq, wasSelected, ghost, moved: false, x: e.clientX, y: e.clientY };
  render();
  document.body.appendChild(ghost);
  ghost.style.display = "none";
}

window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) {
    drag.moved = true; drag.ghost.style.display = "";
  }
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
});

window.addEventListener("pointerup", (e) => {
  if (!drag) return;
  const d = drag; drag = null; d.ghost.remove();
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".sq")?.dataset.sq;
  if (target && target !== d.from && movesFrom(d.from + target).length) return tryMove(d.from, target);
  if (!d.moved && d.wasSelected) selected = null;
  render();
});

function tryMove(from, to) {
  const cands = movesFrom(from + to);
  if (cands.length === 1) return play(cands[0]);
  // promotion: offer the four pieces
  const promo = $("promo") || (() => {
    const el = document.createElement("div"); el.id = "promo"; $("board").appendChild(el); return el;
  })();
  promo.innerHTML = `<div class="choices"></div>`;
  for (const p of "qrbn") {
    const b = document.createElement("button");
    b.appendChild(pieceEl(state.human === "w" ? p.toUpperCase() : p));
    b.onclick = (ev) => { ev.stopPropagation(); promo.style.display = "none"; play(from + to + p); };
    promo.firstElementChild.appendChild(b);
  }
  promo.onpointerdown = (ev) => { if (ev.target === promo) { promo.style.display = "none"; selected = null; render(); } };
  promo.style.display = "flex";
}

async function play(uci) {
  selected = null;
  state = await api("/api/move", { move: uci });
  render();
  if (!state.error) await engineTurn();
}

async function engineTurn() {
  if (!state.engine || state.status || state.turn === state.human) return;
  thinking = true; render();
  state = await api("/api/go", {});
  thinking = false; render();
}

// ---- controls ----
for (const id of ["color", "time"]) {
  $(id).addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset.v;
    if (v) { prefs[id] = v; renderPanel(); }
  });
}
$("engine").addEventListener("change", (e) => { prefs.engine = e.target.value; renderPanel(); });

$("new").onclick = async () => {
  if (thinking) return;
  selected = null;
  const color = prefs.color === "r" ? (Math.random() < 0.5 ? "w" : "b") : prefs.color;
  state = await api("/api/new", { color, movetime: +prefs.time, engine: $("engine").value, fen: $("fen").value.trim() });
  prefs.engine = state.engine ?? prefs.engine;
  flipped = state.human === "b";
  render();
  await engineTurn();
};
$("undo").onclick = async () => {
  if (thinking) return;
  selected = null;
  state = await api("/api/undo", {});
  render();
  await engineTurn();
};
$("flip").onclick = () => { flipped = !flipped; render(); };

(async () => {
  state = await api("/api/state");
  prefs.color = state.human;
  prefs.time = ["0.1", "0.5", "1", "3", "10"].includes(String(state.movetime)) ? String(state.movetime) : "1";
  prefs.engine = state.engine;
  flipped = state.human === "b";
  render();
  await engineTurn();
})();
</script>
</body>
</html>
