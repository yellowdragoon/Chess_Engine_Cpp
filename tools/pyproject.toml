[project]
name = "chess-engine-tools"
version = "0.1.0"
description = "Match runner, data tools and NNUE trainer for Chess_Engine_Cpp"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "numpy>=1.26",
    "torch>=2.2",
]

[tool.uv]
package = false

[dependency-groups]
test = [
    "playwright>=1.65.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # deprecations inside python-chess and Playwright on new Pythons, not ours
    "ignore::DeprecationWarning:chess.*",
    "ignore::DeprecationWarning:playwright.*",
    "ignore::DeprecationWarning:pyee.*",
]
